<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" font-family="'Pretendard','Apple SD Gothic Neo','Noto Sans KR',sans-serif">
  <defs>
    <marker id="arg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#3ba272"/>
    </marker>
  </defs>
  <rect width="760" height="300" fill="#ffffff"/>
  <text x="24" y="28" font-size="12.5" font-weight="700" fill="#1d2530">RICE: 램지 최적성장 순환 × 지역 분해</text>

  <g>
    <rect x="70" y="48" width="180" height="46" rx="9" fill="#f7f8fa" stroke="#3ba272"/>
    <text x="160" y="76" font-size="12.5" font-weight="700" fill="#1d2530" text-anchor="middle">생산 (GDP)</text>
  </g>
  <line x1="250" y1="71" x2="428" y2="71" stroke="#3ba272" stroke-width="1.6" marker-end="url(#arg)"/>
  <g>
    <rect x="432" y="48" width="200" height="46" rx="9" fill="#f7f8fa" stroke="#3ba272"/>
    <text x="532" y="70" font-size="12.5" font-weight="700" fill="#1d2530" text-anchor="middle">소비 · 투자 · 감축 배분</text>
    <text x="532" y="86" font-size="10" fill="#556172" text-anchor="middle">권역별 최적화</text>
  </g>
  <line x1="532" y1="94" x2="532" y2="140" stroke="#3ba272" stroke-width="1.6" marker-end="url(#arg)"/>
  <g>
    <rect x="432" y="144" width="200" height="46" rx="9" fill="#f7f8fa" stroke="#3ba272"/>
    <text x="532" y="166" font-size="12.5" font-weight="700" fill="#1d2530" text-anchor="middle">배출 → 기온 상승</text>
    <text x="532" y="182" font-size="10" fill="#556172" text-anchor="middle">탄소순환 · 기후 방정식</text>
  </g>
  <line x1="432" y1="167" x2="254" y2="167" stroke="#3ba272" stroke-width="1.6" marker-end="url(#arg)"/>
  <g>
    <rect x="70" y="144" width="180" height="46" rx="9" fill="#f7f8fa" stroke="#3ba272"/>
    <text x="160" y="166" font-size="12.5" font-weight="700" fill="#1d2530" text-anchor="middle">생산성 손실</text>
    <text x="160" y="182" font-size="10" fill="#556172" text-anchor="middle">피해함수: 기온의 2차 함수</text>
  </g>
  <line x1="160" y1="144" x2="160" y2="98" stroke="#3ba272" stroke-width="1.6" marker-end="url(#arg)"/>

  <text x="330" y="126" font-size="10.5" fill="#3ba272" font-weight="600" text-anchor="middle">되먹임 순환</text>

  <g>
    <rect x="70" y="222" width="562" height="52" rx="9" fill="#f7f8fa" stroke="#e2e5ea"/>
    <text x="86" y="243" font-size="11" font-weight="700" fill="#1d2530">DICE의 지역 분해판: 세계를 복수 권역으로 나누어 각각 최적화</text>
    <g font-size="10" fill="#556172">
      <rect x="86" y="252" width="52" height="16" rx="8" fill="#ffffff" stroke="#e2e5ea"/><text x="112" y="264" text-anchor="middle">미국</text>
      <rect x="144" y="252" width="52" height="16" rx="8" fill="#ffffff" stroke="#e2e5ea"/><text x="170" y="264" text-anchor="middle">중국</text>
      <rect x="202" y="252" width="52" height="16" rx="8" fill="#ffffff" stroke="#e2e5ea"/><text x="228" y="264" text-anchor="middle">EU</text>
      <rect x="260" y="252" width="60" height="16" rx="8" fill="#ffffff" stroke="#e2e5ea"/><text x="290" y="264" text-anchor="middle">아프리카</text>
      <rect x="326" y="252" width="52" height="16" rx="8" fill="#ffffff" stroke="#e2e5ea"/><text x="352" y="264" text-anchor="middle">인도</text>
      <text x="392" y="264">… 권역별 배출·피해·정책이 서로 다름</text>
    </g>
  </g>
</svg>
