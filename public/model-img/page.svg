    <line x1="52" y1="168" x2="150" y2="168" stroke="#e2e5ea"/>
    <text x="164" y="162" font-size="10.5" fill="#556172">피해함수 곡률</text>
    <path d="M 60 218 Q 110 176 140 218" fill="none" stroke="#e8684a" stroke-width="1.8"/>
    <line x1="52" y1="218" x2="150" y2="218" stroke="#e2e5ea"/>
    <text x="164" y="212" font-size="10.5" fill="#556172">지역별 취약성</text>
  </g>
  <line x1="240" y1="148" x2="290" y2="148" stroke="#e8684a" stroke-width="1.6" marker-end="url(#arr)"/>

  <g>
    <rect x="294" y="98" width="184" height="100" rx="10" fill="#f7f8fa" stroke="#e8684a"/>
    <text x="386" y="130" font-size="12.5" font-weight="700" fill="#1d2530" text-anchor="middle">몬테카를로</text>
    <text x="386" y="148" font-size="12.5" font-weight="700" fill="#1d2530" text-anchor="middle">시뮬레이션</text>
    <text x="386" y="170" font-size="10.5" fill="#556172" text-anchor="middle">분포에서 수천 회 반복 추출</text>
    <text x="386" y="186" font-size="10.5" fill="#556172" text-anchor="middle">+ 대규모 불연속(재앙) 위험 반영</text>
  </g>
  <line x1="478" y1="148" x2="528" y2="148" stroke="#e8684a" stroke-width="1.6" marker-end="url(#arr)"/>

  <g>
    <rect x="532" y="50" width="204" height="196" rx="10" fill="#fdf1ee" stroke="#e8684a"/>
    <text x="634" y="74" font-size="12" font-weight="700" fill="#1d2530" text-anchor="middle">결과 = 분포 전체</text>
    <g fill="#e8684a">
      <rect x="560" y="196" width="14" height="22" rx="2" opacity="0.45"/>
      <rect x="578" y="172" width="14" height="46" rx="2" opacity="0.6"/>
      <rect x="596" y="140" width="14" height="78" rx="2" opacity="0.8"/>
      <rect x="614" y="118" width="14" height="100" rx="2"/>
      <rect x="632" y="134" width="14" height="84" rx="2" opacity="0.85"/>
