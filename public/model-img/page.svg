<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 280" font-family="'Pretendard','Apple SD Gothic Neo','Noto Sans KR',sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#e8684a"/>
    </marker>
  </defs>
  <rect width="760" height="280" fill="#ffffff"/>
  <text x="24" y="28" font-size="12.5" font-weight="700" fill="#1d2530">PAGE: 불확실성을 확률분포로 다루는 구조</text>

  <g>
    <rect x="24" y="50" width="216" height="196" rx="10" fill="#f7f8fa" stroke="#e2e5ea"/>
    <text x="132" y="74" font-size="12" font-weight="700" fill="#1d2530" text-anchor="middle">핵심 파라미터 = 확률분포</text>
    <path d="M 60 118 Q 100 74 140 118" fill="none" stroke="#e8684a" stroke-width="1.8"/>
